<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14251a">
<title>IROX | گزارش روزانه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14251a; --ink-2:#203b29; --ivory:#f4f8f4; --card:#ffffff; --line:#dce8dd; --line-2:#c8d8ca;
  --muted:#718074; --text:#17231a; --bronze:#9bdc28; --bronze-soft:#eff9dc; --danger:#d62828; --ok:#168447;
  --radius:14px;
  --font:'Vazirmatn',Tahoma,system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ivory);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.7;
  padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* header */
.top{background:var(--ink);color:#f7fff7;padding:calc(22px + env(safe-area-inset-top,0px)) 0 30px;border-radius:0 0 22px 22px;
  border-bottom:2px solid var(--bronze)}
.brand{font-family:'Inter',system-ui,sans-serif;font-weight:600;font-size:13px;letter-spacing:.42em;color:var(--bronze);direction:ltr;text-align:right;margin-bottom:14px}
.top h1{margin:0;font-size:24px;font-weight:700;line-height:1.4}
.top p{margin:2px 0 0;font-size:13.5px;color:#c6d2c8}

/* cards & fields */
main{margin-top:-14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:14px;
  box-shadow:0 1px 2px rgba(20,37,26,.05),0 6px 18px -10px rgba(20,37,26,.10)}
.field+.field{margin-top:14px}
.time-row > .field + .field{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.time-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
.time-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:0}
.time-pair .control{min-width:0;text-align:center;padding:8px 4px}
@media(max-width:380px){.time-row{gap:9px}.time-pair{gap:5px}.time-pair .control{padding-inline:2px}}
label,.lbl{display:block;font-size:13px;font-weight:500;color:#536257;margin-bottom:6px}
.tprev{min-height:20px;margin:6px 2px 0;font-size:13px;color:var(--muted);text-align:center;direction:ltr;letter-spacing:.04em}
.tprev:empty{display:none}
.control{width:100%;min-height:52px;padding:10px 14px;background:#fff;border:1px solid var(--line-2);border-radius:12px;outline:none;
  transition:border-color .15s,box-shadow .15s;appearance:none;-webkit-appearance:none}
.control::placeholder{color:#a0ada2}
.control:focus,.trigger:focus-visible{border-color:var(--ink);box-shadow:0 0 0 3px rgba(155,220,40,.24)}
.ltr{direction:ltr;text-align:right}
.field.bad .control,.field.bad .trigger{border-color:var(--danger)}
.err{margin:6px 2px 0;font-size:12.5px;color:var(--danger);min-height:0}
.err:empty{display:none}
textarea.control{resize:none;min-height:84px;line-height:1.8;overflow:hidden}
.title-input{min-height:52px;height:52px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;padding-top:11px;padding-bottom:11px}

/* dropdown trigger */
.trigger{width:100%;min-height:52px;padding:8px 14px;background:#fff;border:1px solid var(--line-2);border-radius:12px;display:flex;align-items:center;
  justify-content:space-between;gap:10px;cursor:pointer;text-align:right;transition:border-color .15s,box-shadow .15s,transform .08s}
.trigger:active{transform:scale(.99)}
.trigger .ph{color:#a0ada2}
.trigger svg{flex:none;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bronze-soft);color:#36551d;border:1px solid #d5e9b5;border-radius:999px;padding:2px 6px 2px 12px;font-size:13.5px}
.chip [data-rm]{all:unset;cursor:pointer;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;color:#5c8424}
.chip [data-rm]:hover{background:#e1f2c7}

/* activities */
.sec-title{font-size:14px;font-weight:600;margin:26px 2px 0;color:var(--ink)}
.act-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.act-title{font-weight:600;color:var(--ink)}
.act-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr) minmax(0,1fr);gap:8px;margin-top:14px;align-items:end}
.act-grid .field{min-width:0;margin-top:0}
.act-grid .control{min-width:0;padding-inline:7px}
.duration-pair{display:grid;grid-template-columns:1fr 1fr;gap:6px;min-width:0}
.duration-pair .control{min-width:0;text-align:center;padding:8px 3px}
.unit-wrap{width:auto;min-width:0}
.unit-btn{width:100%;min-width:0;padding-inline:5px;font-size:13px;gap:3px;white-space:nowrap}
.unit-btn svg{width:12px;height:12px}
.qty{display:flex;gap:8px;align-items:flex-end}
.qty .control{flex:1;min-width:0}
.unit-wrap{flex:none;width:100%;max-width:104px;min-width:0;display:flex;flex-direction:column;gap:6px}
.unit-label{display:block;font-size:13px;font-weight:500;color:#536257;margin:0 2px}
.unit-btn{flex:none;min-width:0;min-height:52px;padding:0 6px;border:1px solid var(--line-2);border-radius:12px;background:var(--bronze-soft);color:#36551d;
  font-weight:500;display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:transform .08s,border-color .15s}
.unit-btn:active{transform:scale(.97)}
.unit-btn:focus-visible{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(155,220,40,.24)}

/* submit */
.submit{margin-top:22px;width:100%;min-height:58px;border:0;border-radius:14px;background:var(--ink);color:#f7fff7;font-weight:600;font-size:16.5px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 24px -12px rgba(20,37,26,.6);transition:transform .08s,background .15s}
.submit:hover{background:var(--ink-2)}
.submit:active{transform:scale(.985)}
.submit[disabled]{opacity:.75;cursor:progress}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(247,242,232,.35);border-top-color:#f7fff7;animation:sp .7s linear infinite;display:none}
.submit.loading .spin{display:block}
@keyframes sp{to{transform:rotate(360deg)}}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(20,19,17,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.overlay.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset-inline:0;bottom:0;margin:0 auto;max-width:520px;background:#fff;border-radius:22px 22px 0 0;z-index:51;
  transform:translateY(105%);transition:transform .24s cubic-bezier(.2,.8,.2,1);padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:80vh;display:flex;flex-direction:column;outline:none}
.sheet.on{transform:none}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line-2);margin:0 auto 10px}
.sheet h3{margin:0 2px 8px;font-size:15px;font-weight:600}
.list{overflow:auto;-webkit-overflow-scrolling:touch}
.item{width:100%;min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border:0;background:none;border-radius:12px;cursor:pointer;text-align:right;font-size:15.5px}
.item:active{background:var(--ivory)}
.item.sel{background:var(--bronze-soft);color:#5a4524;font-weight:600}
.item .tick{opacity:0;color:var(--bronze)}
.item.sel .tick{opacity:1}
.ugrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ugrid .item{justify-content:center;border:1px solid var(--line);font-size:14.5px;padding:8px 6px}
.ugrid .item.sel{border-color:var(--bronze)}
.done{margin-top:10px;min-height:50px;border:0;border-radius:12px;background:var(--ink);color:#f7fff7;font-weight:600;cursor:pointer}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);opacity:0;pointer-events:none;z-index:60;width:calc(100% - 32px);max-width:480px;
  background:var(--ink);color:#f7fff7;border-radius:14px;padding:14px 16px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 14px 34px -14px rgba(0,0,0,.6);transition:opacity .2s,transform .25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast .dot{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;margin-top:1px;background:var(--ok)}
.toast.error .dot{background:var(--danger)}
.toast .t{font-size:14.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">IROX</div>
  <h1>گزارش روزانه</h1>
  <p>ثبت عملکرد روزانه استادکاران</p>
</div></header>

<main class="wrap">
<form id="form" novalidate autocomplete="off">

  <div class="card">
    <div class="time-row">
      <div class="field" id="f-start">
        <label>ساعت شروع</label>
        <div class="time-pair">
          <input id="start-minute" class="control ltr time-part" inputmode="numeric" placeholder="دقیقه" maxlength="2" aria-label="دقیقه شروع" autocomplete="off">
          <input id="start-hour" class="control ltr time-part" inputmode="numeric" placeholder="ساعت" maxlength="2" aria-label="ساعت شروع" autocomplete="off">
        </div>
        <div class="tprev" id="start-prev" aria-live="polite"></div>
        <p class="err"></p>
      </div>
      <div class="field" id="f-end">
        <label>ساعت پایان</label>
        <div class="time-pair">
          <input id="end-minute" class="control ltr time-part" inputmode="numeric" placeholder="دقیقه" maxlength="2" aria-label="دقیقه پایان" autocomplete="off">
          <input id="end-hour" class="control ltr time-part" inputmode="numeric" placeholder="ساعت" maxlength="2" aria-label="ساعت پایان" autocomplete="off">
        </div>
        <div class="tprev" id="end-prev" aria-live="polite"></div>
        <p class="err"></p>
      </div>
    </div>
    <div class="field" id="f-project">
      <label for="project">نام پروژه</label>
      <input id="project" class="control" type="text" placeholder="نام پروژه را وارد کنید" autocomplete="off">
      <p class="err"></p>
    </div>
    <div class="field" id="f-foreman">
      <span class="lbl">استادکار</span>
      <button type="button" class="trigger" id="foreman-btn" aria-haspopup="listbox"><span class="ph">انتخاب استادکار</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
      <input id="foreman" type="hidden" value="">
      <p class="err"></p>
    </div>
    <div class="field" id="f-apps">
      <span class="lbl">شاگردان</span>
      <button type="button" class="trigger" id="apps-btn" aria-haspopup="listbox"><span class="ph">انتخاب شاگرد</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
      <p class="err"></p>
    </div>
  </div>

  <div class="sec-title">فعالیت‌ها</div>
  <div id="acts"></div>

  <div class="card">
    <div class="field">
      <label for="notes">توضیحات اضافه</label>
      <textarea id="notes" class="control" placeholder="مشکلات، اتفاقات، کمبود مصالح یا پیشنهادها..."></textarea>
    </div>
  </div>

  <button type="submit" class="submit" id="submit"><span class="spin" aria-hidden="true"></span><span id="submit-t">ثبت گزارش روزانه</span></button>
</form>
</main>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1" inert><div class="grab"></div><h3 id="sheet-t"></h3><div class="list" id="sheet-list"></div><button type="button" class="done" id="sheet-done" hidden>تأیید</button></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span class="dot"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" id="toast-ic"><path d="M20 6 9 17l-5-5"/></svg></span><span class="t" id="toast-t"></span></div>

<script>
/* ===== Settings (edit here) ===== */
const CONFIG = {
  // آدرس Web App گوگل (Apps Script) را اینجا بگذارید؛ باید با https://script.google.com/ شروع شود
  WEBHOOK_URL: 'https://dpihhthgwur.app.n8n.cloud/webhook/irox-daily-report-v2',
  TIMEOUT_MS: 20000,
  PROJECTS: ['کیلان', 'آبسرد'],
  FOREMEN: ['مسعود یعقوبی', 'مهدی موسوی', 'امیر نوری', 'صادق موسوی', 'مجتبی موسوی', 'احمد موسوی'],
  APPRENTICES: ['مصطفی موسوی', 'دلاور حسینی', 'رمضان زارعی', 'حامد'],
  UNITS: ['متر','ساعت','عدد','کیلوگرم','متر مربع'],
  DEFAULT_UNIT: 'عدد',
  ACTIVITY_LABELS: ['فعالیت اول','فعالیت دوم','فعالیت سوم','فعالیت چهارم'],
  MSG_OK: 'گزارش شما با موفقیت ثبت شد.',
  MSG_FAIL: 'ارسال گزارش انجام نشد. لطفاً دوباره تلاش کنید.',
  MSG_NOURL: 'آدرس اتصال به گوگل شیت تنظیم نشده است.'
};

// <pure>
const toLatin = s => String(s).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const digitsOf = (s, max) => toLatin(s).replace(/\D/g, '').slice(0, max);
function cleanQty(v){ let s = toLatin(v).replace(/[٫,،]/g, '.').replace(/[^\d.]/g, ''); const i = s.indexOf('.'); if (i !== -1) s = s.slice(0, i + 1) + s.slice(i + 1).replace(/\./g, ''); return s.slice(0, 9); }
// </pure>

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function newId(){ return (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
function autoGrow(t){ t.style.height = 'auto'; t.style.height = (t.scrollHeight + t.offsetHeight - t.clientHeight) + 'px'; }
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const CHEV = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
const state = { foreman: '', apprentices: [], units: [CONFIG.DEFAULT_UNIT, CONFIG.DEFAULT_UNIT, CONFIG.DEFAULT_UNIT, CONFIG.DEFAULT_UNIT], unitTouched: [false, false, false, false], activityCount: 4 };
let submissionId = newId();

/* ----- activities ----- */
function activityMarkup(i){
  const lab = `فعالیت ${['اول','دوم','سوم','چهارم'][i] || (i + 1)}`;
  return `
  <section class="card" data-i="${i}">
    <div class="act-head"><span class="act-title">${lab}</span></div>
    <div class="field"><label for="title-${i}">عنوان فعالیت</label>
      <textarea id="title-${i}" class="control act-title-in title-input" rows="1" placeholder="مثلاً جوشکاری سازه" autocomplete="off"></textarea><p class="err"></p></div>
    <div class="act-grid">
      <div class="field"><label>مقدار</label>
        <input class="control ltr qty-in" inputmode="decimal" placeholder="0" aria-label="مقدار ${lab}" autocomplete="off"><p class="err"></p></div>
      <div class="unit-wrap"><span class="unit-label">واحد</span>
        <button type="button" class="unit-btn" aria-label="انتخاب واحد ${lab}"><span>${state.units[i] || CONFIG.DEFAULT_UNIT}</span>${CHEV}</button></div>
      <div class="field"><label>مدت</label>
        <div class="duration-pair">
          <input id="dur-minute-${i}" class="control ltr duration-part" inputmode="numeric" placeholder="دقیقه" maxlength="2" aria-label="دقیقه مدت ${lab}" autocomplete="off">
          <input id="dur-hour-${i}" class="control ltr duration-part" inputmode="numeric" placeholder="ساعت" maxlength="3" aria-label="ساعت مدت ${lab}" autocomplete="off">
        </div><p class="err"></p></div>
    </div>
  </section>`;
}
function renderActivities(){
  $('#acts').innerHTML = Array.from({length: state.activityCount}, (_, i) => activityMarkup(i)).join('');
  $$('.unit-btn').forEach((b, i) => b.addEventListener('click', () => openSheet({
    title: 'واحد فعالیت ' + (i + 1), options: CONFIG.UNITS, selected: [state.units[i] || CONFIG.DEFAULT_UNIT], grid: true,
    onChange: v => { state.units[i] = v[0]; state.unitTouched[i] = true; for (let j = i + 1; j < state.activityCount; j++) if (!state.unitTouched[j]) state.units[j] = v[0]; renderUnits(); }
  })));
}
renderActivities();

/* ----- masks ----- */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.classList.contains('time-part')) { t.value = digitsOf(t.value, 2); clearErr(t); updatePreview(t.id.split('-')[0]); }
  else if (t.classList.contains('duration-part')) { t.value = digitsOf(t.value, t.id.includes('-hour-') ? 3 : 2); clearErr(t); }
  else if (t.classList.contains('qty-in')) { t.value = cleanQty(t.value); clearErr(t); }
  else if (t.id === 'notes' || t.classList.contains('title-input')) {
    if (t.classList.contains('title-input') && /[\r\n]/.test(t.value)) t.value = t.value.replace(/[\r\n]+/g, ' ');
    autoGrow(t); clearErr(t);
  }
  else if (t.type === 'text') clearErr(t);
});

/* Enter in single-line fields moves to the next field instead of submitting the report */
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  const t = e.target;
  if (!(t instanceof HTMLElement) || !(t.tagName === 'INPUT' || t.classList.contains('title-input'))) return;
  e.preventDefault();
  const list = $$('#form input:not([type="hidden"]), #form textarea');
  const nx = list[list.indexOf(t) + 1];
  if (nx) nx.focus();
});

/* ----- errors ----- */
function setErr(fieldId, msg){ const f = typeof fieldId === 'string' ? document.getElementById(fieldId) : fieldId; if (!f) return; f.classList.add('bad'); const p = $('.err', f); if (p) p.textContent = msg; }
function clearErr(inp){ const f = inp.closest('.field'); if (!f) return; f.classList.remove('bad'); const p = $('.err', f); if (p) p.textContent = ''; }

/* ----- bottom sheet ----- */
const overlay = $('#overlay'), sheet = $('#sheet'), listEl = $('#sheet-list'), doneBtn = $('#sheet-done');
let lastFocus = null;
let sheetConfirm = null;
let sheetSelection = null;
function openSheet({ title, options, selected, multi, grid, confirm, onChange }){
  lastFocus = document.activeElement;
  $('#sheet-t').textContent = title;
  const sel = new Set(selected);
  sheetSelection = sel;
  sheetConfirm = confirm ? onChange : null;
  listEl.className = 'list' + (grid ? ' ugrid' : '');
  const tick = '<svg class="tick" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  listEl.innerHTML = options.map(o => `<button type="button" class="item${sel.has(o) ? ' sel' : ''}" data-v="${esc(o)}" role="option" aria-selected="${sel.has(o)}"><span>${esc(o)}</span>${grid ? '' : tick}</button>`).join('');
  doneBtn.hidden = !(multi || confirm);
  doneBtn.textContent = 'تأیید';
  listEl.onclick = e => {
    const b = e.target.closest('.item'); if (!b) return;
    const v = b.dataset.v;
    if (multi) {
      sel.has(v) ? sel.delete(v) : sel.add(v);
      b.classList.toggle('sel', sel.has(v));
      b.setAttribute('aria-selected', sel.has(v));
      onChange(options.filter(x => sel.has(x)));
    } else if (confirm) {
      sel.clear(); sel.add(v);
      $$('.item', listEl).forEach(item => {
        const isSelected = item.dataset.v === v;
        item.classList.toggle('sel', isSelected);
        item.setAttribute('aria-selected', String(isSelected));
      });
    } else { onChange([v]); closeSheet(); }
  };
  sheet.inert = false; overlay.classList.add('on'); sheet.classList.add('on'); sheet.focus({ preventScroll: true });
}
function closeSheet(){
  overlay.classList.remove('on'); sheet.classList.remove('on'); sheet.inert = true;
  sheetConfirm = null; sheetSelection = null;
  if (lastFocus) lastFocus.focus({ preventScroll: true });
}
overlay.addEventListener('click', closeSheet);
doneBtn.addEventListener('click', () => {
  if (sheetConfirm) sheetConfirm(sheetSelection ? Array.from(sheetSelection) : []);
  sheetConfirm = null; sheetSelection = null;
  closeSheet();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet.classList.contains('on')) closeSheet(); });

/* project is entered manually in the project text field */

/* foreman selection */
function renderForeman(){
  const b = $('#foreman-btn');
  const chev = b.lastElementChild;
  b.innerHTML = state.foreman
    ? `<span>${esc(state.foreman)}</span>`
    : '<span class="ph">انتخاب استادکار</span>';
  b.appendChild(chev);
  $('#foreman').value = state.foreman;
  if (state.foreman) clearErr($('#foreman'));
}
$('#foreman-btn').addEventListener('click', () => {
  openSheet({
    title: 'انتخاب استادکار',
    options: CONFIG.FOREMEN,
    selected: state.foreman ? [state.foreman] : [],
    multi: false,
    confirm: true,
    onChange: v => { state.foreman = v[0] || ''; renderForeman(); }
  });
});

/* apprentices */
function renderApps(){
  const b = $('#apps-btn'); const chev = b.lastElementChild;
  const inner = state.apprentices.length
    ? '<span class="chips">' + state.apprentices.map(n => `<span class="chip">${esc(n)}<span role="button" tabindex="0" data-rm="${esc(n)}" aria-label="حذف ${esc(n)}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></span></span>`).join('') + '</span>'
    : '<span class="ph">انتخاب شاگرد</span>';
  b.innerHTML = inner; b.appendChild(chev);
  if (state.apprentices.length) clearErr(b);
}
$('#apps-btn').addEventListener('keydown', e => {
  const rm = e.target.closest && e.target.closest('[data-rm]');
  if (!rm || (e.key !== 'Enter' && e.key !== ' ')) return;
  e.preventDefault(); e.stopPropagation();
  state.apprentices = state.apprentices.filter(n => n !== rm.dataset.rm); renderApps(); $('#apps-btn').focus();
});
$('#apps-btn').addEventListener('click', e => {
  const rm = e.target.closest('[data-rm]');
  if (rm) { e.stopPropagation(); state.apprentices = state.apprentices.filter(n => n !== rm.dataset.rm); renderApps(); return; }
  openSheet({ title: 'شاگردان', options: CONFIG.APPRENTICES, selected: state.apprentices, multi: true, onChange: v => { state.apprentices = v; renderApps(); } });
});

/* units */
function renderUnits(){ $$('.unit-btn').forEach((b, i) => { if (b.firstElementChild) b.firstElementChild.textContent = state.units[i] || CONFIG.DEFAULT_UNIT; }); }

/* ----- toast ----- */
let toastTimer;
function toast(msg, type){
  const t = $('#toast'); t.className = 'toast on' + (type === 'error' ? ' error' : '');
  $('#toast-t').textContent = msg;
  $('#toast-ic').innerHTML = type === 'error' ? '<path d="M18 6 6 18M6 6l12 12"/>' : '<path d="M20 6 9 17l-5-5"/>';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), type === 'error' ? 6500 : 4500);
}

/* ----- time helpers: hour + minute inputs -> "8:05" ----- */
function timeParts(prefix){
  return { hour: digitsOf($('#' + prefix + '-hour').value, 2), minute: digitsOf($('#' + prefix + '-minute').value, 2) };
}
function timeText(prefix){
  const { hour, minute } = timeParts(prefix);
  if (!hour && !minute) return '';
  return `${Number(hour || 0)}:${String(Number(minute || 0)).padStart(2, '0')}`;
}
function updatePreview(prefix){ const el = document.getElementById(prefix + '-prev'); if (el) el.textContent = timeText(prefix); }
function timeOutOfRange(prefix){
  const { hour, minute } = timeParts(prefix);
  return (hour !== '' && Number(hour) > 23) || (minute !== '' && Number(minute) > 59);
}
function durationParts(index){
  return {
    hour: digitsOf($('#dur-hour-' + index).value, 3),
    minute: digitsOf($('#dur-minute-' + index).value, 2)
  };
}
function durationText(index){
  const { hour, minute } = durationParts(index);
  if (!hour && !minute) return '';
  return `${Number(hour || 0)}:${String(Number(minute || 0)).padStart(2, '0')}`;
}

/* ----- validate & build payload ----- */
function collect(){
  // Every field is optional; only impossible/invalid values are blocked.
  let bad = false, first = null;
  $$('.field.bad').forEach(f => { f.classList.remove('bad'); const p = $('.err', f); if (p) p.textContent = ''; });
  const mark = (f, msg) => { setErr(f, msg); bad = true; const el = typeof f === 'string' ? document.getElementById(f) : f; if (!first) first = el; };
  [['start', 'f-start'], ['end', 'f-end']].forEach(([p, f]) => {
    const parts = timeParts(p);
    if (!parts.hour) {
      mark(f, 'وارد کردن ساعت الزامی است.');
    } else if (timeOutOfRange(p)) {
      mark(f, 'ساعت باید ۰ تا ۲۳ و دقیقه ۰ تا ۵۹ باشد.');
    }
  });

  if (!$('#project').value.trim()) mark('f-project', 'وارد کردن نام پروژه الزامی است.');
  if (!$('#foreman').value.trim()) mark('f-foreman', 'انتخاب نام استادکار الزامی است.');
  if (!state.apprentices.length) mark('f-apps', 'انتخاب حداقل یک شاگرد الزامی است.');
  const activityCards = $$('#acts .card');
  const hasAtLeastOneActivity = activityCards.some(card => $('.act-title-in', card).value.trim());
  if (!hasAtLeastOneActivity) {
    const firstTitleField = activityCards[0] && $('.act-title-in', activityCards[0]).closest('.field');
    mark(firstTitleField || '#acts', 'حداقل عنوان یک فعالیت را وارد کنید.');
  }

  const activities = activityCards.map((card, i) => {
    const title = $('.act-title-in', card).value.replace(/\s*[\r\n]+\s*/g, ' ').trim();
    const qtyRaw = $('.qty-in', card).value.trim();
    const duration = durationParts(i);
    const dur = durationText(i);
    const titleField = $('.act-title-in', card).closest('.field');
    const qtyField = $('.qty-in', card).closest('.field');
    const durField = $('#dur-minute-' + i).closest('.field');
    const hasQty = qtyRaw !== '';
    const hasDur = duration.hour !== '' || duration.minute !== '';
    let quantity = null;
    if (qtyRaw) {
      quantity = Number(qtyRaw);
      if (!Number.isFinite(quantity)) { quantity = null; mark(qtyField, 'مقدار نامعتبر است.'); }
    }
    if (duration.minute !== '' && Number(duration.minute) > 59) mark(durField, 'دقیقه باید بین ۰ تا ۵۹ باشد.');
    // Per-activity consistency: title, quantity and duration go together.
    // All empty -> fine. Title without quantity/duration -> error. Quantity/duration without title -> error.
    if (title) {
      if (!hasQty) mark(qtyField, 'مقدار را وارد کنید.');
      if (!hasDur) mark(durField, 'مدت را وارد کنید.');
    } else if (hasQty || hasDur) {
      mark(titleField, 'عنوان فعالیت را وارد کنید.');
    }
    return {
      index: i + 1,
      title,
      quantity,
      unit: qtyRaw ? (state.units[i] || CONFIG.DEFAULT_UNIT) : '',
      duration: dur
    };
  });
  if (bad) { if (first && first.scrollIntoView) first.scrollIntoView({ behavior: 'smooth', block: 'center' }); return null; }
  const norm = p => ({ hour: String(Number(p.hour || 0)), minute: String(Number(p.minute || 0)) });
  const st = norm(timeParts('start')), en = norm(timeParts('end'));
  return {
    reportType: 'daily_work_report',
    submissionId,
    submittedAt: new Date().toISOString(),
    startHour: st.hour,
    startMinute: st.minute,
    endHour: en.hour,
    endMinute: en.minute,
    startTime: timeText('start'),
    endTime: timeText('end'),
    project: $('#project').value.trim(),
    foreman: $('#foreman').value.trim(),
    apprentices: state.apprentices.slice(),
    activities,
    notes: $('#notes').value.trim()
  };
}

/* ----- submit ----- */
let sending = false;
$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  if (sending) return;
  if (!/^https:\/\/dpihhthgwur\.app\.n8n\.cloud\/webhook\//.test(CONFIG.WEBHOOK_URL)) { toast('آدرس وب‌هوک n8n معتبر نیست.', 'error'); return; }
  const payload = collect();
  if (!payload) { toast('لطفاً موارد مشخص‌شده را تکمیل کنید.', 'error'); return; }
  sending = true;
  const btn = $('#submit'); btn.disabled = true; btn.classList.add('loading'); $('#submit-t').textContent = 'در حال ارسال…';
  const attempt = async () => {
    const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), CONFIG.TIMEOUT_MS);
    try { return await fetch(CONFIG.WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), signal: ctrl.signal }); }
    finally { clearTimeout(timer); }
  };
  try {
    let res;
    try { res = await attempt(); }
    catch (e1) { await new Promise(r => setTimeout(r, 1200)); res = await attempt(); } /* one automatic retry on network failure */
    let data = null; try { data = await res.json(); } catch (_) {}
    if (!res.ok || (data && data.success === false)) { const er = new Error('bad response ' + res.status); er.status = res.status; er.serverMessage = data && data.status === 'invalid_report' && data.message ? (data.message + (Array.isArray(data.missing) && data.missing.length ? ' (' + data.missing.join('، ') + ')' : '')) : ''; throw er; }
    resetForm(); toast(CONFIG.MSG_OK, 'ok'); window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (err) {
    let msg = err && err.serverMessage;
    if (!msg) {
      if (err && err.status) msg = CONFIG.MSG_FAIL + ' (کد خطا: ' + err.status + ')';
      else if (err && err.name === 'AbortError') msg = 'پاسخی از سرور نیامد (اینترنت کند است). دوباره تلاش کنید.';
      else msg = 'ارتباط با سرور برقرار نشد؛ اینترنت یا فیلترشکن را بررسی کنید و دوباره تلاش کنید.';
    }
    toast(msg, 'error');
  } finally {
    sending = false; btn.disabled = false; btn.classList.remove('loading'); $('#submit-t').textContent = 'ثبت گزارش روزانه';
  }
});

function resetForm(){
  $('#form').reset();
  state.apprentices = []; state.units = [CONFIG.DEFAULT_UNIT, CONFIG.DEFAULT_UNIT, CONFIG.DEFAULT_UNIT, CONFIG.DEFAULT_UNIT]; state.unitTouched = [false, false, false, false]; state.activityCount = 4;
  state.foreman = ''; submissionId = newId();
  $('#project').value = ''; renderActivities(); renderForeman(); renderApps(); $('#notes').style.height = 'auto'; updatePreview('start'); updatePreview('end');
  $$('.field.bad').forEach(f => { f.classList.remove('bad'); const p = $('.err', f); if (p) p.textContent = ''; });
}
</script>
